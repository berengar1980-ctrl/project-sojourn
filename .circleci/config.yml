version: 2.1

jobs:
  format-and-push:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Format changed sector files
          command: >-
            npx prettier --write
            src/app/game-controller.ts
            src/ui/space/procedural-surface-textures.ts
            src/data/maps/narrows-sector.ts
            src/data/ports/sector-ports.ts
            src/data/economy/tutorial-npc-economy.ts
            tests/economy/sector-economy-coverage.test.cjs
            tests/economy/mining-resource-flow.test.cjs
      - run:
          name: Commit formatted files
          command: |
            git config user.name "CircleCI Formatter"
            git config user.email "circleci@project-sojourn.local"
            git add               src/app/game-controller.ts               src/ui/space/procedural-surface-textures.ts               src/data/maps/narrows-sector.ts               src/data/ports/sector-ports.ts               src/data/economy/tutorial-npc-economy.ts               tests/economy/sector-economy-coverage.test.cjs               tests/economy/mining-resource-flow.test.cjs
            git diff --cached --quiet && exit 0
            git commit -m "Format expanded sector files"
            git push origin HEAD:refs/heads/feat/expand-sector-world

workflows:
  formatter:
    jobs:
      - format-and-push:
          filters:
            branches:
              only: ci-gate
