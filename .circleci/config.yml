version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  format-code:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src tests docs README.md package.json tsconfig.json vite.config.ts eslint.config.mjs

  lint:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npm run lint

  typecheck:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npm run typecheck

  dependencies:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npm run deps:check

  tests:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npm test

  build:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npm run build

workflows:
  code-quality-diagnostics:
    jobs:
      - format-code:
          filters: { branches: { only: ci-gate } }
      - lint:
          filters: { branches: { only: ci-gate } }
      - typecheck:
          filters: { branches: { only: ci-gate } }
      - dependencies:
          filters: { branches: { only: ci-gate } }
      - tests:
          filters: { branches: { only: ci-gate } }
      - build:
          filters: { branches: { only: ci-gate } }
