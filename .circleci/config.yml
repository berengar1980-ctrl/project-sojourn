version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  fmt-core:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/core

  fmt-data:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/data

  fmt-features:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/features

  fmt-systems:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/systems

  fmt-ui-map:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/ui/map

  fmt-ui-space:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/ui/space

  fmt-ui-other:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/ui --ignore-path /tmp/no-prettier-ignore

  fmt-test-economy:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/economy

  fmt-test-map:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/map

  fmt-test-quality:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/quality

  fmt-test-rest:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/assets tests/local-space tests/navigation tests/port tests/ships tests/run-tests.cjs tests/ts-module-loader.cjs


workflows:
  format-directory-diagnostics:
    jobs:
      - fmt-core:
          filters: { branches: { only: ci-gate } }
      - fmt-data:
          filters: { branches: { only: ci-gate } }
      - fmt-features:
          filters: { branches: { only: ci-gate } }
      - fmt-systems:
          filters: { branches: { only: ci-gate } }
      - fmt-ui-map:
          filters: { branches: { only: ci-gate } }
      - fmt-ui-space:
          filters: { branches: { only: ci-gate } }
      - fmt-test-economy:
          filters: { branches: { only: ci-gate } }
      - fmt-test-map:
          filters: { branches: { only: ci-gate } }
      - fmt-test-quality:
          filters: { branches: { only: ci-gate } }
      - fmt-test-rest:
          filters: { branches: { only: ci-gate } }
