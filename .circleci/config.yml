version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  fmt-src:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src

  fmt-tests:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests

  fmt-docs:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check docs README.md

  fmt-root:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check package.json tsconfig.json vite.config.ts eslint.config.mjs index.html start-sojourn.cmd scripts

  fmt-ci:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check .circleci .github

workflows:
  top-level-format-diagnostics:
    jobs:
      - fmt-src:
          filters: { branches: { only: ci-gate } }
      - fmt-tests:
          filters: { branches: { only: ci-gate } }
      - fmt-docs:
          filters: { branches: { only: ci-gate } }
      - fmt-root:
          filters: { branches: { only: ci-gate } }
      - fmt-ci:
          filters: { branches: { only: ci-gate } }
