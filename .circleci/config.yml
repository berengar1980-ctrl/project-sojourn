version: 2.1

jobs:
  metadata-present:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - run:
          name: Check CircleCI GitHub metadata
          command: |
            test -n "$CIRCLE_PROJECT_USERNAME"
            test -n "$CIRCLE_PROJECT_REPONAME"
            test -n "$CIRCLE_SHA1"

  token-auth:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - run:
          name: Check GitHub token authentication
          command: |
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $SOJOURN_GITHUB_STATUS_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/user > /dev/null

  status-write:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run:
          name: Write diagnostic status
          command: node scripts/ci-run-and-report.cjs --smoke

workflows:
  diagnostic-smoke:
    jobs:
      - metadata-present:
          filters:
            branches:
              only: ci-gate
      - token-auth:
          requires:
            - metadata-present
          filters:
            branches:
              only: ci-gate
      - status-write:
          requires:
            - token-auth
          filters:
            branches:
              only: ci-gate
