  hunk-275-299:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: |
          npx prettier --write src/ui/map/topdown-map-renderer.ts >/dev/null
          git diff --unified=0 -- src/ui/map/topdown-map-renderer.ts > /tmp/renderer.diff
          awk '/^@@/ { split($3,a,","); gsub("+","",a[1]); if (a[1] >= 275 && a[1] <= 299) found=1 } END { exit found ? 0 : 1 }' /tmp/renderer.diff


workflows:
  renderer-diff-narrow:
    jobs:
      - hunk-200-224:
          filters: { branches: { only: ci-gate } }
      - hunk-225-249:
          filters: { branches: { only: ci-gate } }
      - hunk-250-274:
          filters: { branches: { only: ci-gate } }
      - hunk-275-299:
