version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  format-file:
    parameters:
      file:
        type: string
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run:
          command: npx prettier --check << parameters.file >>

workflows:
  prettier-file-diagnostics:
    jobs:
      - format-file:
          name: fmt-bootstrap
          file: src/app/bootstrap.ts
          filters: { branches: { only: ci-gate } }
      - format-file:
          name: fmt-game-controller
          file: src/app/game-controller.ts
          filters: { branches: { only: ci-gate } }
      - format-file:
          name: fmt-surface-textures
          file: src/ui/space/procedural-surface-textures.ts
          filters: { branches: { only: ci-gate } }
      - format-file:
          name: fmt-body-renderer
          file: src/ui/space/procedural-space-body-renderer.ts
          filters: { branches: { only: ci-gate } }
      - format-file:
          name: fmt-sector-map
          file: src/data/maps/narrows-sector.ts
          filters: { branches: { only: ci-gate } }
      - format-file:
          name: fmt-map-alias
          file: src/data/maps/tutorial-cluster.ts
          filters: { branches: { only: ci-gate } }
      - format-file:
          name: fmt-sector-ports
          file: src/data/ports/sector-ports.ts
          filters: { branches: { only: ci-gate } }
      - format-file:
          name: fmt-port-alias
          file: src/data/ports/tutorial-ports.ts
          filters: { branches: { only: ci-gate } }
      - format-file:
          name: fmt-sector-npcs
          file: src/data/economy/sector-npc-economy.ts
          filters: { branches: { only: ci-gate } }
      - format-file:
          name: fmt-npc-alias
          file: src/data/economy/tutorial-npc-economy.ts
          filters: { branches: { only: ci-gate } }
      - format-file:
          name: fmt-mining-resources
          file: src/data/resources/mining-resources.ts
          filters: { branches: { only: ci-gate } }
      - format-file:
          name: fmt-map-test
          file: tests/map/tutorial-map.test.cjs
          filters: { branches: { only: ci-gate } }
      - format-file:
          name: fmt-sector-test
          file: tests/economy/sector-economy-coverage.test.cjs
          filters: { branches: { only: ci-gate } }
      - format-file:
          name: fmt-pricing-test
          file: tests/economy/market-pricing.test.cjs
          filters: { branches: { only: ci-gate } }
      - format-file:
          name: fmt-mining-test
          file: tests/economy/mining-resource-flow.test.cjs
          filters: { branches: { only: ci-gate } }
      - format-file:
          name: fmt-local-test
          file: tests/local-space/local-space.test.cjs
          filters: { branches: { only: ci-gate } }
      - format-file:
          name: fmt-port-test
          file: tests/port/port-ui.test.cjs
          filters: { branches: { only: ci-gate } }
