version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  fmt-src:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src

  fmt-tests:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests

  test-economy:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: for file in tests/economy/*.test.cjs; do node "$file" || exit 1; done

  test-map:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: for file in tests/map/*.test.cjs; do node "$file" || exit 1; done

  test-quality:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: for file in tests/quality/*.test.cjs; do node "$file" || exit 1; done

  test-rest:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: |
          for dir in tests/assets tests/local-space tests/navigation tests/port tests/ships; do
            for file in "$dir"/*.test.cjs; do
              node "$file" || exit 1
            done
          done

workflows:
  remaining-diagnostics:
    jobs:
      - fmt-src:
          filters: { branches: { only: ci-gate } }
      - fmt-tests:
          filters: { branches: { only: ci-gate } }
      - test-economy:
          filters: { branches: { only: ci-gate } }
      - test-map:
          filters: { branches: { only: ci-gate } }
      - test-quality:
          filters: { branches: { only: ci-gate } }
      - test-rest:
          filters: { branches: { only: ci-gate } }
