version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  fmt-economy-tests:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/economy

  fmt-map-tests:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/map

  fmt-port-tests:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/port

workflows:
  test-directory-format-diagnostics:
    jobs:
      - fmt-economy-tests:
          filters: { branches: { only: ci-gate } }
      - fmt-map-tests:
          filters: { branches: { only: ci-gate } }
      - fmt-port-tests:
          filters: { branches: { only: ci-gate } }
