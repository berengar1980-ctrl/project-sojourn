version: 2.1

jobs:
  format-sector-test:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Check sector test formatting
          command: npx prettier --check tests/economy/sector-economy-coverage.test.cjs

workflows:
  diagnostic:
    jobs:
      - format-sector-test:
          filters: { branches: { only: ci-gate } }
