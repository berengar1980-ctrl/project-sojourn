version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  fmt-renderer:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/ui/map/topdown-map-renderer.ts

  fmt-ports:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/data/ports/sector-ports.ts

  fmt-port-profiles:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/data/ports/sector-port-profiles.ts

workflows:
  exact-format-checks:
    jobs:
      - fmt-renderer:
          filters: { branches: { only: ci-gate } }
      - fmt-ports:
          filters: { branches: { only: ci-gate } }
      - fmt-port-profiles:
          filters: { branches: { only: ci-gate } }
