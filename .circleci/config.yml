version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  format-app:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run:
          command: >-
            npx prettier --check
            src/core/world-types.ts
            src/features/star-map/star-map-view-model.ts
            src/app/bootstrap.ts
            src/app/game-controller.ts

  format-render:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run:
          command: >-
            npx prettier --check
            src/ui/space/procedural-surface-textures.ts
            src/ui/space/procedural-space-body-renderer.ts
            src/ui/map/topdown-map-renderer.ts
            src/ui/map/star-map-panel.ts

  format-data:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run:
          command: >-
            npx prettier --check
            src/data/maps/narrows-sector.ts
            src/data/maps/tutorial-cluster.ts
            src/data/ports/sector-ports.ts
            src/data/ports/tutorial-ports.ts
            src/data/economy/sector-npc-economy.ts
            src/data/economy/tutorial-npc-economy.ts
            src/data/resources/mining-resources.ts

  format-local:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run:
          command: npx prettier --check src/systems/local-space/local-space-generator.ts

  format-tests:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run:
          command: >-
            npx prettier --check
            tests/map/tutorial-map.test.cjs
            tests/economy/sector-economy-coverage.test.cjs
            tests/economy/market-pricing.test.cjs
            tests/economy/mining-resource-flow.test.cjs
            tests/local-space/local-space.test.cjs
            tests/port/port-ui.test.cjs

  format-ci:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run:
          command: npx prettier --check .circleci/config.yml

workflows:
  format-diagnostics:
    jobs:
      - format-app:
          filters:
            branches:
              only: ci-gate
      - format-render:
          filters:
            branches:
              only: ci-gate
      - format-data:
          filters:
            branches:
              only: ci-gate
      - format-local:
          filters:
            branches:
              only: ci-gate
      - format-tests:
          filters:
            branches:
              only: ci-gate
      - format-ci:
          filters:
            branches:
              only: ci-gate
