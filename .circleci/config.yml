version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  fmt-world:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/core/world-types.ts

  fmt-resources:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/data/economy/economy-resources.ts

  fmt-npcs:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/data/economy/sector-npc-economy.ts

  fmt-sector:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/data/maps/narrows-sector.ts

  fmt-port-profiles:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/data/ports/sector-port-profiles.ts

  fmt-ports:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/data/ports/sector-ports.ts

workflows:
  exact-format-diagnostics:
    jobs:
      - fmt-world:
          filters: { branches: { only: ci-gate } }
      - fmt-resources:
          filters: { branches: { only: ci-gate } }
      - fmt-npcs:
          filters: { branches: { only: ci-gate } }
      - fmt-sector:
          filters: { branches: { only: ci-gate } }
      - fmt-port-profiles:
          filters: { branches: { only: ci-gate } }
      - fmt-ports:
          filters: { branches: { only: ci-gate } }
