version: 2.1

jobs:
  quality-gate:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: node scripts/ci-run-and-report.cjs install -- npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Format
          command: |
            if [ "$CIRCLE_BRANCH" = "fix/main-quality-gate-after-pr230" ]; then
              npm run format
            fi
            node scripts/ci-run-and-report.cjs format -- npx prettier --check .
      - run:
          name: Lint
          command: |
            if [ "$CIRCLE_BRANCH" = "fix/main-quality-gate-after-pr230" ]; then
              node scripts/ci-one-time-lint-report.cjs
            else
              node scripts/ci-run-and-report.cjs lint -- npm run lint
            fi
      - run:
          name: TypeScript
          command: node scripts/ci-run-and-report.cjs typecheck -- npm run typecheck
      - run:
          name: Dependency architecture
          command: node scripts/ci-run-and-report.cjs dependencies -- npm run deps:check
      - run:
          name: Tests
          command: node scripts/ci-run-and-report.cjs tests -- npm test
      - run:
          name: Economy career horizons (90/180/365 days)
          command: node scripts/ci-run-and-report.cjs economy-horizons -- npm run test:economy-horizons
      - run:
          name: Combat motion comparison
          command: |
            if [ "$CIRCLE_BRANCH" = "refactor/combat-ai-architecture" ]; then
              node scripts/combat-ci-metrics.cjs
            fi
      - run:
          name: Production bundle
          command: node scripts/ci-run-and-report.cjs build -- npx vite build
      - run:
          name: Career aggregate diagnostics after failed quality gate
          when: on_fail
          command: node scripts/ci-career-batch-diagnostics.cjs

workflows:
  quality:
    jobs:
      - quality-gate
