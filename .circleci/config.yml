version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  hunk-200-224:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: |
          npx prettier --write src/ui/map/topdown-map-renderer.ts >/dev/null
          git diff --unified=0 -- src/ui/map/topdown-map-renderer.ts > /tmp/renderer.diff
          node -e "const s=require('fs').readFileSync('/tmp/renderer.diff','utf8'); const n=[...s.matchAll(/^@@ .* \\+(\\d+)/gm)].map(m=>Number(m[1])); process.exit(n.some(x=>x>=200&&x<=224)?0:1)"

  hunk-225-249:
