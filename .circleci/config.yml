version: 2.1

commands:
  use-dependencies:
    steps:
      - checkout
      - attach_workspace:
          at: .

jobs:
  prepare:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies once
          command: npm ci
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  economy-tests:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - use-dependencies
      - run:
          name: Economy tests
          command: find tests/economy -name '*.test.cjs' -print0 | sort -z | xargs -0 -n1 node

  map-navigation-tests:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - use-dependencies
      - run:
          name: Map and navigation tests
          command: |
            find tests/map tests/navigation -name '*.test.cjs' -print0 | sort -z | xargs -0 -n1 node

  gameplay-tests:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - use-dependencies
      - run:
          name: Gameplay and asset tests
          command: |
            find tests/assets tests/local-space tests/port tests/ships -name '*.test.cjs' -print0 | sort -z | xargs -0 -n1 node

  quality-tests:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - use-dependencies
      - run:
          name: Quality tests
          command: find tests/quality -name '*.test.cjs' -print0 | sort -z | xargs -0 -n1 node

workflows:
  pinpoint-tests:
    jobs:
      - prepare:
          filters: { branches: { only: ci-gate } }
      - economy-tests:
          requires: [prepare]
          filters: { branches: { only: ci-gate } }
      - map-navigation-tests:
          requires: [prepare]
          filters: { branches: { only: ci-gate } }
      - gameplay-tests:
          requires: [prepare]
          filters: { branches: { only: ci-gate } }
      - quality-tests:
          requires: [prepare]
          filters: { branches: { only: ci-gate } }
