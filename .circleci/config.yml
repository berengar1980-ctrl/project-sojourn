version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  format:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npm run format:check

  lint:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npm run lint

  typecheck:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npm run typecheck

  architecture:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: node tests/quality/architecture.test.cjs

  ports:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: |
          node tests/economy/sector-economy-coverage.test.cjs
          node tests/port/port-ui.test.cjs

workflows:
  split-final-checks:
    jobs:
      - format:
          filters: { branches: { only: ci-gate } }
      - lint:
          filters: { branches: { only: ci-gate } }
      - typecheck:
          filters: { branches: { only: ci-gate } }
      - architecture:
          filters: { branches: { only: ci-gate } }
      - ports:
          filters: { branches: { only: ci-gate } }
