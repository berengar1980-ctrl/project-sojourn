      - prepare
      - run: npx prettier --check src/data/ports/tutorial-ports.ts

  fmt-npcs:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/data/economy/sector-npc-economy.ts

  fmt-npcsalias:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/data/economy/tutorial-npc-economy.ts

  fmt-miningres:
    docker:
      - image: cimg/node:20.18
    resource_class: small
