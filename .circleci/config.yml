version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  fmt-player-ship:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/map/player-ship-rendering.test.cjs

  fmt-space-bodies:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/map/procedural-space-bodies.test.cjs

  fmt-route:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/map/route-planner.test.cjs

  fmt-background:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/map/space-background.test.cjs

workflows:
  legacy-map-format-diagnostics:
    jobs:
      - fmt-player-ship:
          filters: { branches: { only: ci-gate } }
      - fmt-space-bodies:
          filters: { branches: { only: ci-gate } }
      - fmt-route:
          filters: { branches: { only: ci-gate } }
      - fmt-background:
          filters: { branches: { only: ci-gate } }
