version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  fmt-core:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/core/economy-types.ts src/core/local-space-types.ts src/core/port-types.ts src/core/resource-types.ts src/core/shield-types.ts src/core/ship-types.ts src/core/state.ts src/core/system-log-types.ts src/core/world-types.ts

  fmt-data:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/data

  fmt-systems:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/systems

  fmt-features:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/features

  fmt-ui:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/ui

  fmt-app:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/app src/main.ts

  fmt-test-economy:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/economy

  fmt-test-map:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/map/map-visual-scale.test.cjs tests/map/player-ship-rendering.test.cjs tests/map/procedural-space-bodies.test.cjs tests/map/route-planner.test.cjs tests/map/space-background.test.cjs tests/map/tutorial-map.test.cjs

  fmt-test-quality:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/quality

  fmt-test-other:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/assets tests/local-space tests/navigation tests/port tests/ships tests/run-tests.cjs tests/ts-module-loader.cjs

  fmt-project:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check docs scripts README.md package.json tsconfig.json vite.config.ts eslint.config.mjs index.html .github .circleci

  lint:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - prepare
      - run: npm run lint

  typecheck:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - prepare
      - run: npm run typecheck

  dependencies:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - prepare
      - run: npm run deps:check

  tests:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - prepare
      - run: npm test

  build:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - prepare
      - run: npm run build

workflows:
  quality:
    jobs:
      - fmt-core: { filters: { branches: { only: ci-gate } } }
      - fmt-data: { filters: { branches: { only: ci-gate } } }
      - fmt-systems: { filters: { branches: { only: ci-gate } } }
      - fmt-features: { filters: { branches: { only: ci-gate } } }
      - fmt-ui: { filters: { branches: { only: ci-gate } } }
      - fmt-app: { filters: { branches: { only: ci-gate } } }
      - fmt-test-economy: { filters: { branches: { only: ci-gate } } }
      - fmt-test-map: { filters: { branches: { only: ci-gate } } }
      - fmt-test-quality: { filters: { branches: { only: ci-gate } } }
      - fmt-test-other: { filters: { branches: { only: ci-gate } } }
      - fmt-project: { filters: { branches: { only: ci-gate } } }
      - lint: { filters: { branches: { only: ci-gate } } }
      - typecheck: { filters: { branches: { only: ci-gate } } }
      - dependencies: { filters: { branches: { only: ci-gate } } }
      - tests: { filters: { branches: { only: ci-gate } } }
      - build: { filters: { branches: { only: ci-gate } } }
