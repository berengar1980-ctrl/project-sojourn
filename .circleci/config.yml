version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  hunk-200-224:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: |
          npx prettier --write src/ui/map/topdown-map-renderer.ts >/dev/null
          git diff --unified=0 -- src/ui/map/topdown-map-renderer.ts > /tmp/renderer.diff
          awk '/^@@/ { split($3,a,","); gsub("+","",a[1]); if (a[1] >= 200 && a[1] <= 224) found=1 } END { exit found ? 0 : 1 }' /tmp/renderer.diff

  hunk-225-249:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: |
          npx prettier --write src/ui/map/topdown-map-renderer.ts >/dev/null
          git diff --unified=0 -- src/ui/map/topdown-map-renderer.ts > /tmp/renderer.diff
          awk '/^@@/ { split($3,a,","); gsub("+","",a[1]); if (a[1] >= 225 && a[1] <= 249) found=1 } END { exit found ? 0 : 1 }' /tmp/renderer.diff

  hunk-250-274:
    docker:
      - image: cimg/node:20.18
