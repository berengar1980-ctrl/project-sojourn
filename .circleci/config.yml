version: 2.1

jobs:
  secret-present:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run:
          name: Check status token presence
          command: test -n "$SOJOURN_GITHUB_STATUS_TOKEN"

  status-write:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run:
          name: Write diagnostic status
          command: node scripts/ci-run-and-report.cjs --smoke

workflows:
  diagnostic-smoke:
    jobs:
      - secret-present:
          filters:
            branches:
              only: ci-gate
      - status-write:
          requires:
            - secret-present
          filters:
            branches:
              only: ci-gate
