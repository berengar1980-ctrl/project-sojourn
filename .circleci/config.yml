version: 2.1

jobs:
  quality-gate:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: node scripts/ci-run-and-report.cjs install -- npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Format pirate changes
          command: node scripts/ci-run-and-report.cjs format -- npx prettier --check src/core/npc-types.ts src/data/economy/sector-npc-economy.ts src/systems/npcs/npc-combat-ai.ts src/systems/npcs/npc-sector-service.ts src/systems/combat/star-map-engagement-service.ts src/systems/combat/strategic-combat-service.ts src/app/game-controller-star-map.ts src/features/star-map/star-map-view-model.ts src/ui/map/npc-ship-map-renderer.ts src/ui/map/star-map-panel.ts src/ui/combat/strategic-combat-renderer.ts src/ui/ships/pirate-insignia-renderer.ts tests/combat/pirate-npc-behavior.test.cjs tests/economy/npc-sector-simulation.test.cjs
      - run:
          name: Lint pirate changes
          command: node scripts/ci-run-and-report.cjs lint -- npx eslint src/core/npc-types.ts src/data/economy/sector-npc-economy.ts src/systems/npcs/npc-combat-ai.ts src/systems/npcs/npc-sector-service.ts src/systems/combat/star-map-engagement-service.ts src/systems/combat/strategic-combat-service.ts src/app/game-controller-star-map.ts src/features/star-map/star-map-view-model.ts src/ui/map/npc-ship-map-renderer.ts src/ui/map/star-map-panel.ts src/ui/combat/strategic-combat-renderer.ts src/ui/ships/pirate-insignia-renderer.ts
      - run:
          name: TypeScript
          command: node scripts/ci-run-and-report.cjs typecheck -- npm run typecheck
      - run:
          name: Dependency architecture
          command: node scripts/ci-run-and-report.cjs dependencies -- npm run deps:check
      - run:
          name: Pirate NPC behavior
          command: node scripts/ci-run-and-report.cjs pirate-behavior -- node tests/combat/pirate-npc-behavior.test.cjs
      - run:
          name: Production bundle
          command: node scripts/ci-run-and-report.cjs build -- npx vite build

workflows:
  quality:
    jobs:
      - quality-gate:
          filters:
            branches:
              only: ci-gate
