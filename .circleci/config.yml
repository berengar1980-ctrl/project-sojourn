version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  fmt-data:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/core/world-types.ts src/data/economy/economy-resources.ts src/data/economy/sector-npc-economy.ts src/data/maps/narrows-sector.ts src/data/ports/sector-port-profiles.ts src/data/ports/sector-ports.ts

  fmt-map:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/features/star-map/star-map-view-model.ts src/ui/map/map-camera.ts src/ui/map/map-visual-scale.ts src/ui/map/planet-ring-renderer.ts src/ui/map/station-symbol-renderer.ts src/ui/map/topdown-map-renderer.ts

  fmt-space:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/ui/space/procedural-space-body-renderer.ts src/ui/space/procedural-surface-textures.ts src/systems/economy/market-situation-service.ts

  fmt-tests:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/economy tests/map tests/port tests/quality/no-warhammer-references.test.cjs

workflows:
  format-diagnostics:
    jobs:
      - fmt-data:
          filters: { branches: { only: ci-gate } }
      - fmt-map:
          filters: { branches: { only: ci-gate } }
      - fmt-space:
          filters: { branches: { only: ci-gate } }
      - fmt-tests:
          filters: { branches: { only: ci-gate } }
