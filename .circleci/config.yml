version: 2.1

jobs:
  quality-gate:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: node scripts/ci-run-and-report.cjs install -- npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Format
          command: node scripts/ci-run-and-report.cjs format -- npx prettier --check .
      # Temporary diagnostic artifact: capture Prettier's exact changes without relaxing the gate.
      - run:
          name: Export Prettier correction patch
          when: always
          command: |
            mkdir -p /tmp/shipyard-prettier
            npx prettier --write src/app/game-controller-port.ts src/features/port/port-ship-view-model.ts src/features/port/port-view-model.ts src/systems/ships/ship-component-service.ts src/ui/port/port-panel.ts src/ui/port/port-secondary-panes.ts tests/ships/shipyard-component-market.test.cjs
            git diff --binary -- src/app/game-controller-port.ts src/features/port/port-ship-view-model.ts src/features/port/port-view-model.ts src/systems/ships/ship-component-service.ts src/ui/port/port-panel.ts src/ui/port/port-secondary-panes.ts tests/ships/shipyard-component-market.test.cjs > /tmp/shipyard-prettier/prettier.patch
      - store_artifacts:
          path: /tmp/shipyard-prettier
          destination: shipyard-prettier
      - run:
          name: Lint
          command: node scripts/ci-run-and-report.cjs lint -- npm run lint
      - run:
          name: TypeScript
          command: node scripts/ci-run-and-report.cjs typecheck -- npm run typecheck
      - run:
          name: Dependency architecture
          command: node scripts/ci-run-and-report.cjs dependencies -- npm run deps:check
      - run:
          name: Tests
          command: node scripts/ci-run-and-report.cjs tests -- npm test
      - run:
          name: Production bundle
          command: node scripts/ci-run-and-report.cjs build -- npx vite build

workflows:
  quality:
    jobs:
      - quality-gate
