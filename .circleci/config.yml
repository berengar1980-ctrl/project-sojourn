version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  fmt-bootstrap:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/app/bootstrap.ts

  fmt-controller:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/app/game-controller.ts

  fmt-surface:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/ui/space/procedural-surface-textures.ts

  fmt-body:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/ui/space/procedural-space-body-renderer.ts

  fmt-mapdata:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check src/data/maps/narrows-sector.ts

  fmt-mapalias:
