version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  format:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npm run format:check

  test-architecture:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: node tests/quality/architecture.test.cjs

  test-dependencies:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: node tests/quality/dependencies.test.cjs

  test-local-start:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: node tests/quality/local-start.test.cjs

  test-naming:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: node tests/quality/naming.test.cjs

  test-tooling:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: node tests/quality/tooling.test.cjs

  test-no-warhammer:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: node tests/quality/no-warhammer-references.test.cjs

workflows:
  final-diagnostics:
    jobs:
      - format:
          filters: { branches: { only: ci-gate } }
      - test-architecture:
          filters: { branches: { only: ci-gate } }
      - test-dependencies:
          filters: { branches: { only: ci-gate } }
      - test-local-start:
          filters: { branches: { only: ci-gate } }
      - test-naming:
          filters: { branches: { only: ci-gate } }
      - test-tooling:
          filters: { branches: { only: ci-gate } }
      - test-no-warhammer:
          filters: { branches: { only: ci-gate } }
