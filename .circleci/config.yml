version: 2.1

commands:
  use-dependencies:
    steps:
      - checkout
      - attach_workspace:
          at: .

jobs:
  prepare:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run: npm ci
      - persist_to_workspace:
          root: .
          paths: [node_modules]

  fmt-economy-test:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - use-dependencies
      - run: npx prettier --check tests/economy/sector-economy-coverage.test.cjs

  fmt-map-test:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - use-dependencies
      - run: npx prettier --check tests/map/map-visual-scale.test.cjs

  fmt-ship-test:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - use-dependencies
      - run: npx prettier --check tests/ships/ships-module.test.cjs

workflows:
  pinpoint-test-format:
    jobs:
      - prepare:
          filters: { branches: { only: ci-gate } }
      - fmt-economy-test:
          requires: [prepare]
          filters: { branches: { only: ci-gate } }
      - fmt-map-test:
          requires: [prepare]
          filters: { branches: { only: ci-gate } }
      - fmt-ship-test:
          requires: [prepare]
          filters: { branches: { only: ci-gate } }
