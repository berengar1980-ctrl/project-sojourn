      - run: npx prettier --check tests/port/port-ui.test.cjs

workflows:
  prettier-file-diagnostics:
    jobs:
      - fmt-bootstrap:
          filters: { branches: { only: ci-gate } }
      - fmt-controller:
          filters: { branches: { only: ci-gate } }
      - fmt-surface:
          filters: { branches: { only: ci-gate } }
      - fmt-body:
          filters: { branches: { only: ci-gate } }
      - fmt-mapdata:
          filters: { branches: { only: ci-gate } }
      - fmt-mapalias:
          filters: { branches: { only: ci-gate } }
      - fmt-ports:
          filters: { branches: { only: ci-gate } }
      - fmt-portsalias:
          filters: { branches: { only: ci-gate } }
      - fmt-npcs:
          filters: { branches: { only: ci-gate } }
      - fmt-npcsalias:
          filters: { branches: { only: ci-gate } }
      - fmt-miningres:
          filters: { branches: { only: ci-gate } }
      - fmt-maptest:
