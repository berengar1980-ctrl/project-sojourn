      - run: npx prettier --check tests/economy/sector-economy-coverage.test.cjs

  fmt-pricing:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/economy/market-pricing.test.cjs

  fmt-miningtest:
