version: 2.1

jobs:
  export-formatted-reporter:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Format reporter
          command: npx prettier --write scripts/ci-run-and-report.cjs
      - run:
          name: Export formatted reporter
          command: node scripts/ci-export-file.cjs scripts/ci-run-and-report.cjs

workflows:
  format-export:
    jobs:
      - export-formatted-reporter:
          filters:
            branches:
              only: ci-gate
