version: 2.1

jobs:
  ctl-a:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run: npx prettier --check --range-start 0 --range-end 8300 src/app/game-controller.ts

  ctl-b:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run: npx prettier --check --range-start 8300 --range-end 17000 src/app/game-controller.ts

  surf-a:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run: npx prettier --check --range-start 0 --range-end 5400 src/ui/space/procedural-surface-textures.ts

  surf-b:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run: npx prettier --check --range-start 5400 --range-end 11000 src/ui/space/procedural-surface-textures.ts

  map-a:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run: npx prettier --check --range-start 0 --range-end 6200 src/data/maps/narrows-sector.ts

  map-b:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run: npx prettier --check --range-start 6200 --range-end 12500 src/data/maps/narrows-sector.ts

  ports-a:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run: npx prettier --check --range-start 0 --range-end 6200 src/data/ports/sector-ports.ts

  ports-b:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run: npx prettier --check --range-start 6200 --range-end 12500 src/data/ports/sector-ports.ts

  econ-a:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run: npx prettier --check --range-start 0 --range-end 2500 tests/economy/sector-economy-coverage.test.cjs

  econ-b:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run: npx prettier --check --range-start 2500 --range-end 5100 tests/economy/sector-economy-coverage.test.cjs

workflows:
  prettier-range-diagnostics:
    jobs:
      - ctl-a:
          filters: { branches: { only: ci-gate } }
      - ctl-b:
          filters: { branches: { only: ci-gate } }
      - surf-a:
          filters: { branches: { only: ci-gate } }
      - surf-b:
          filters: { branches: { only: ci-gate } }
      - map-a:
          filters: { branches: { only: ci-gate } }
      - map-b:
          filters: { branches: { only: ci-gate } }
      - ports-a:
          filters: { branches: { only: ci-gate } }
      - ports-b:
          filters: { branches: { only: ci-gate } }
      - econ-a:
          filters: { branches: { only: ci-gate } }
      - econ-b:
          filters: { branches: { only: ci-gate } }
