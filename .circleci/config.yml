version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - run: npm ci

jobs:
  fmt-core:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: >-
          npx prettier --check
          src/core/world-types.ts
          src/features/star-map/star-map-view-model.ts
          src/ui/map/map-camera.ts

  fmt-map:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: >-
          npx prettier --check
          src/ui/map/station-symbol-renderer.ts
          src/ui/map/planet-ring-renderer.ts
          src/ui/map/topdown-map-renderer.ts

  fmt-space:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: >-
          npx prettier --check
          src/ui/space/procedural-surface-textures.ts
          src/ui/space/procedural-space-body-renderer.ts

  fmt-data:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: >-
          npx prettier --check
          src/data/maps/narrows-sector.ts
          src/data/ports/sector-ports.ts
          src/data/economy/economy-resources.ts
          src/data/economy/sector-npc-economy.ts
          src/systems/economy/market-situation-service.ts

  fmt-tests:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: >-
          npx prettier --check
          tests/map/tutorial-map.test.cjs
          tests/economy/sector-economy-coverage.test.cjs
          tests/economy/market-pricing.test.cjs
          tests/economy/market-situations.test.cjs
          tests/economy/daily-simulation.test.cjs
          tests/economy/npc-economy.test.cjs
          tests/economy/npc-resource-side-trade.test.cjs
          tests/port/port-ui.test.cjs

workflows:
  formatting-diagnostics:
    jobs:
      - fmt-core:
          filters: { branches: { only: ci-gate } }
      - fmt-map:
          filters: { branches: { only: ci-gate } }
      - fmt-space:
          filters: { branches: { only: ci-gate } }
      - fmt-data:
          filters: { branches: { only: ci-gate } }
      - fmt-tests:
          filters: { branches: { only: ci-gate } }
