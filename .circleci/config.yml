version: 2.1

jobs:
  quality-gate:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: node scripts/ci-run-and-report.cjs install -- npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: TypeScript
          command: node scripts/ci-run-and-report.cjs typecheck -- npm run typecheck
      - run:
          name: Dependency architecture
          command: node scripts/ci-run-and-report.cjs dependencies -- npm run deps:check
      - run:
          name: Spatial combat
          command: node scripts/ci-run-and-report.cjs spatial-combat -- node tests/combat/spatial-combat.test.cjs
      - run:
          name: Local combat UI
          command: node scripts/ci-run-and-report.cjs local-combat-ui -- node tests/combat/local-space-attack-ui.test.cjs
      - run:
          name: Weapons and mines
          command: node scripts/ci-run-and-report.cjs weapons-mines -- node tests/combat/ship-weapons-mines.test.cjs
      - run:
          name: Local collision
          command: node scripts/ci-run-and-report.cjs local-collision -- node tests/ui/local-collision-salvage-map-controls.test.cjs
      - run:
          name: Production bundle
          command: node scripts/ci-run-and-report.cjs build -- npx vite build

workflows:
  quality:
    jobs:
      - quality-gate:
          filters:
            branches:
              only: ci-gate
