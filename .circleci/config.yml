version: 2.1

jobs:
  autoformat:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Apply exact Prettier formatting
          command: npx prettier --write src/core/world-types.ts tests/map/map-visual-scale.test.cjs
      - run:
          name: Commit formatted files
          command: |
            git config user.name "Project Sojourn CI"
            git config user.email "ci@project-sojourn.invalid"
            git add src/core/world-types.ts tests/map/map-visual-scale.test.cjs
            if git diff --cached --quiet; then
              echo "No formatting changes required"
              exit 0
            fi
            git commit -m "Apply Prettier to remaining files"
            git push origin HEAD:feat/rework-sector-visuals

workflows:
  autoformat:
    jobs:
      - autoformat:
          filters:
            branches:
              only: ci-gate
