version: 2.1

jobs:
  sector-test:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Sector economy coverage
          command: node tests/economy/sector-economy-coverage.test.cjs

workflows:
  pinpoint-sector:
    jobs:
      - sector-test:
          filters: { branches: { only: ci-gate } }
