version: 2.1

jobs:
  fmt-controller:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run: npx prettier --check src/app/game-controller.ts

  fmt-surface:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run: npx prettier --check src/ui/space/procedural-surface-textures.ts

  fmt-mapdata:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run: npx prettier --check src/data/maps/narrows-sector.ts

  fmt-ports:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run: npx prettier --check src/data/ports/sector-ports.ts

  fmt-npcsalias:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run: npx prettier --check src/data/economy/tutorial-npc-economy.ts

  fmt-econcover:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run: npx prettier --check tests/economy/sector-economy-coverage.test.cjs

  fmt-miningtest:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - run: npm ci
      - run: npx prettier --check tests/economy/mining-resource-flow.test.cjs

workflows:
  prettier-recheck:
    jobs:
      - fmt-controller:
          filters: { branches: { only: ci-gate } }
      - fmt-surface:
          filters: { branches: { only: ci-gate } }
      - fmt-mapdata:
          filters: { branches: { only: ci-gate } }
      - fmt-ports:
          filters: { branches: { only: ci-gate } }
      - fmt-npcsalias:
          filters: { branches: { only: ci-gate } }
      - fmt-econcover:
          filters: { branches: { only: ci-gate } }
      - fmt-miningtest:
          filters: { branches: { only: ci-gate } }
