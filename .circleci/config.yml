version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  hunk-000-099:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: |
          npx prettier --write src/ui/map/topdown-map-renderer.ts >/dev/null
          git diff --unified=0 -- src/ui/map/topdown-map-renderer.ts > /tmp/renderer.diff
          grep '^@@' /tmp/renderer.diff | grep -Eq '\+[1-9][0-9]?(,| )'

  hunk-100-199:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: |
          npx prettier --write src/ui/map/topdown-map-renderer.ts >/dev/null
          git diff --unified=0 -- src/ui/map/topdown-map-renderer.ts > /tmp/renderer.diff
          grep '^@@' /tmp/renderer.diff | grep -Eq '\+1[0-9][0-9](,| )'

  hunk-200-299:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: |
          npx prettier --write src/ui/map/topdown-map-renderer.ts >/dev/null
          git diff --unified=0 -- src/ui/map/topdown-map-renderer.ts > /tmp/renderer.diff
          grep '^@@' /tmp/renderer.diff | grep -Eq '\+2[0-9][0-9](,| )'

  hunk-300-399:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: |
          npx prettier --write src/ui/map/topdown-map-renderer.ts >/dev/null
          git diff --unified=0 -- src/ui/map/topdown-map-renderer.ts > /tmp/renderer.diff
          grep '^@@' /tmp/renderer.diff | grep -Eq '\+3[0-9][0-9](,| )'

  hunk-count-1:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: |
          npx prettier --write src/ui/map/topdown-map-renderer.ts >/dev/null
          git diff --unified=0 -- src/ui/map/topdown-map-renderer.ts > /tmp/renderer.diff
          test "$(grep -c '^@@' /tmp/renderer.diff)" -eq 1

  hunk-count-2:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: |
          npx prettier --write src/ui/map/topdown-map-renderer.ts >/dev/null
          git diff --unified=0 -- src/ui/map/topdown-map-renderer.ts > /tmp/renderer.diff
          test "$(grep -c '^@@' /tmp/renderer.diff)" -eq 2

  hunk-count-3:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: |
          npx prettier --write src/ui/map/topdown-map-renderer.ts >/dev/null
          git diff --unified=0 -- src/ui/map/topdown-map-renderer.ts > /tmp/renderer.diff
          test "$(grep -c '^@@' /tmp/renderer.diff)" -eq 3


workflows:
  renderer-diff-locator:
    jobs:
      - hunk-000-099:
          filters: { branches: { only: ci-gate } }
      - hunk-100-199:
          filters: { branches: { only: ci-gate } }
      - hunk-200-299:
          filters: { branches: { only: ci-gate } }
      - hunk-300-399:
          filters: { branches: { only: ci-gate } }
      - hunk-count-1:
          filters: { branches: { only: ci-gate } }
      - hunk-count-2:
          filters: { branches: { only: ci-gate } }
      - hunk-count-3:
          filters: { branches: { only: ci-gate } }
