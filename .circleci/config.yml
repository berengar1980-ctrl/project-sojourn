version: 2.1

commands:
  use-dependencies:
    steps:
      - checkout
      - attach_workspace:
          at: .

jobs:
  prepare:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run: npm ci
      - persist_to_workspace:
          root: .
          paths: [node_modules]

  sector-test:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - use-dependencies
      - run: node tests/economy/sector-economy-coverage.test.cjs

  npc-tests:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - use-dependencies
      - run: node tests/economy/npc-economy.test.cjs
      - run: node tests/economy/npc-resource-side-trade.test.cjs

  changed-tests:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - use-dependencies
      - run: node tests/map/map-visual-scale.test.cjs
      - run: node tests/ships/ships-module.test.cjs

  build:
    docker: [{ image: cimg/node:20.18 }]
    resource_class: small
    steps:
      - use-dependencies
      - run: npx vite build

workflows:
  pinpoint-verify:
    jobs:
      - prepare:
          filters: { branches: { only: ci-gate } }
      - sector-test:
          requires: [prepare]
          filters: { branches: { only: ci-gate } }
      - npc-tests:
          requires: [prepare]
          filters: { branches: { only: ci-gate } }
      - changed-tests:
          requires: [prepare]
          filters: { branches: { only: ci-gate } }
      - build:
          requires: [prepare]
          filters: { branches: { only: ci-gate } }
