version: 2.1

commands:
  prepare:
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: npm ci

jobs:
  fmt-daily:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/economy/daily-simulation.test.cjs

  fmt-pricing:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/economy/market-pricing.test.cjs

  fmt-situations:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/economy/market-situations.test.cjs

  fmt-npc:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/economy/npc-economy.test.cjs

  fmt-side-trade:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/economy/npc-resource-side-trade.test.cjs

  fmt-coverage:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/economy/sector-economy-coverage.test.cjs

  fmt-map-test:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/map/tutorial-map.test.cjs

  fmt-port-test:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - prepare
      - run: npx prettier --check tests/port/port-ui.test.cjs

workflows:
  test-format-diagnostics:
    jobs:
      - fmt-daily:
          filters: { branches: { only: ci-gate } }
      - fmt-pricing:
          filters: { branches: { only: ci-gate } }
      - fmt-situations:
          filters: { branches: { only: ci-gate } }
      - fmt-npc:
          filters: { branches: { only: ci-gate } }
      - fmt-side-trade:
          filters: { branches: { only: ci-gate } }
      - fmt-coverage:
          filters: { branches: { only: ci-gate } }
      - fmt-map-test:
          filters: { branches: { only: ci-gate } }
      - fmt-port-test:
          filters: { branches: { only: ci-gate } }
