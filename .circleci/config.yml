version: 2.1

commands:
  use-prepared-dependencies:
    steps:
      - checkout
      - attach_workspace:
          at: .

jobs:
  quick-gate:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: node scripts/ci-run-and-report.cjs install -- npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Format
          command: node scripts/ci-run-and-report.cjs format -- node scripts/ci-format-first-diff.cjs src/core/ship-gameplay-types.ts src/core/ship-types.ts src/data/ships/ship-role-profiles.ts src/data/ships/ship-components.ts src/systems/ships/ship-gameplay.ts src/systems/ships/ship-stations.ts src/systems/ships/index.ts tests/ships/ship-gameplay.test.cjs
      - run:
          name: Lint
          command: node scripts/ci-run-and-report.cjs lint -- npm run lint
      - run:
          name: TypeScript
          command: node scripts/ci-run-and-report.cjs typecheck -- npm run typecheck
      - run:
          name: Dependency architecture
          command: node scripts/ci-run-and-report.cjs dependencies -- npm run deps:check
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  verify:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - use-prepared-dependencies
      - run:
          name: Tests
          command: node scripts/ci-run-and-report.cjs tests -- npm test
      - run:
          name: Production bundle
          command: node scripts/ci-run-and-report.cjs build -- npx vite build

workflows:
  quality:
    jobs:
      - quick-gate:
          filters:
            branches:
              only: ci-gate
      - verify:
          requires:
            - quick-gate
          filters:
            branches:
              only: ci-gate
