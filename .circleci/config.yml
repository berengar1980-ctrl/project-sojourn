version: 2.1

jobs:
  quality-gate:
    docker:
      - image: cimg/node:20.18
    resource_class: small
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-v1-{{ checksum "package-lock.json" }}
            - npm-v1-
      - run:
          name: Install dependencies
          command: node scripts/ci-run-and-report.cjs install -- npm ci
      - save_cache:
          key: npm-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm
      - run:
          name: Format pirate test probe
          command: node scripts/ci-run-and-report.cjs format -- node scripts/prettier-pirate-test-probe.cjs
      - run:
          name: Lint pirate additions
          command: node scripts/ci-run-and-report.cjs lint -- npx eslint src/core/npc-types.ts src/data/economy/sector-npc-economy.ts src/systems/npcs/npc-combat-ai.ts src/ui/ships/pirate-insignia-renderer.ts
      - run:
          name: TypeScript
          command: node scripts/ci-run-and-report.cjs typecheck -- npm run typecheck
      - run:
          name: Dependency architecture
          command: node scripts/ci-run-and-report.cjs dependencies -- npm run deps:check
      - run:
          name: Pirate NPC behavior
          command: node scripts/ci-run-and-report.cjs pirate-behavior -- node tests/combat/pirate-npc-behavior.test.cjs
      - run:
          name: Production bundle
          command: node scripts/ci-run-and-report.cjs build -- npx vite build

workflows:
  quality:
    jobs:
      - quality-gate:
          filters:
            branches:
              only: ci-gate
