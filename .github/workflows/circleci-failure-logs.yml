name: CircleCI failure logs

on:
  workflow_dispatch:
    inputs:
      job_number:
        description: 'CircleCI job number (leave empty for 3 latest failed jobs)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CIRCLECI_API_TOKEN: ${{ secrets.CIRCLECI_API_TOKEN }}
      CIRCLECI_JOB_NUMBER: ${{ inputs.job_number }}
    steps:
      - name: Fetch failed CircleCI step logs
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CIRCLECI_API_TOKEN" ]]; then
            echo "::error::Missing repository secret CIRCLECI_API_TOKEN"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.request, urllib.error

          org, project = "berengar1980-ctrl", "project-sojourn"
          root = f"https://circleci.com/api/v1.1/project/github/{org}/{project}"
          token = os.environ["CIRCLECI_API_TOKEN"]
          out = pathlib.Path("circleci-diagnostics")
          out.mkdir(exist_ok=True)

          def get_json(url, authorized=False):
              headers = {"Accept": "application/json"}
              if authorized:
                  headers["Circle-Token"] = token
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          requested = os.environ.get("CIRCLECI_JOB_NUMBER", "").strip()
          if requested:
              if not requested.isascii() or not requested.isdigit():
                  raise SystemExit("job_number must be numeric")
              numbers = [int(requested)]
          else:
              jobs = get_json(root + "?filter=failed", authorized=True)
              numbers = [int(item["build_num"]) for item in jobs if item.get("build_num")][:3]
          if not numbers:
              raise SystemExit("No failed CircleCI jobs returned")

          overview = []
          for number in numbers:
              details = get_json(f"{root}/{number}", authorized=True)
              job_dir = out / f"job-{number}"
              job_dir.mkdir(exist_ok=True)
              lines = [f"# CircleCI job {number}", f"Status: {details.get('status', 'unknown')}"]
              saved = 0
              for i, step in enumerate(details.get("steps", [])):
                  name = step.get("name", f"step-{i}")
                  for j, action in enumerate(step.get("actions", [])):
                      if not (action.get("failed") or action.get("status") in ("failed", "error", "canceled")):
                          continue
                      lines.append(f"- Failed step: {name} (exit code: {action.get('exit_code')})")
                      url = action.get("output_url")
                      if not url:
                          continue
                      # URL is short-lived and not stored in the artifact.
                      messages = get_json(url)
                      content = "".join(item.get("message", "") for item in messages if isinstance(item, dict))
                      content = content.replace(token, "[REDACTED]")
                      safe = re.sub(r"[^A-Za-z0-9_-]", "-", name)[:55]
                      (job_dir / f"{i:02d}-{j:02d}-{safe}.txt").write_text(content[:500000], encoding="utf-8")
                      saved += 1
              (job_dir / "summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
              overview.extend(lines + [""])
              print(f"Job {number}: {saved} failed step logs downloaded")
          (out / "README.md").write_text("\n".join(overview), encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(overview))
          PY

      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: circleci-failure-logs
          path: circleci-diagnostics/
          if-no-files-found: warn
          retention-days: 3
