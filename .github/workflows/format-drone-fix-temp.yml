name: Temporary drone formatting
on:
  push:
    branches:
      - fix/security-drone-combat-navigation
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-drone-combat-navigation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/systems/operations/asteroid-security-drone.ts src/app/game-controller-security.ts tests/operations/asteroid-security-drone.test.cjs
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/systems/operations/asteroid-security-drone.ts src/app/game-controller-security.ts tests/operations/asteroid-security-drone.test.cjs
          if ! git diff --cached --quiet; then
            git commit -m "Apply project Prettier formatting to drone fix"
            git push origin HEAD:fix/security-drone-combat-navigation
          fi
