name: Temporary drone visual beam formatter
on:
  push:
    branches:
      - fix/drone-size-spin-shield-beam-cleanup
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/drone-size-spin-shield-beam-cleanup
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/ui/combat/strategic-combat-renderer.ts src/ui/local-space/local-security-drone-visual.ts src/ui/salvage/salvage-scene-layers.ts tests/ui/security-drone-sprite.test.cjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/combat/strategic-combat-renderer.ts src/ui/local-space/local-security-drone-visual.ts src/ui/salvage/salvage-scene-layers.ts tests/ui/security-drone-sprite.test.cjs
          if ! git diff --cached --quiet; then
            git commit -m "Apply Prettier to drone size and beam cleanup"
            git push origin HEAD:fix/drone-size-spin-shield-beam-cleanup
          fi
