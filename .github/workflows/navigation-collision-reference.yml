name: Navigation and collision reference

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: navigation-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reference:
    if: github.head_ref == 'refactor/unified-navigation-collision'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fixed pre-refactor baseline
        uses: actions/checkout@v4
        with:
          ref: ef2f3ac5f917cc61782079ad94c9e8ae56a43c4c
          path: baseline
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install locked dependencies
        run: |
          npm ci --prefix baseline
          npm ci --prefix candidate
      - name: Capture deterministic combat references
        run: |
          mkdir -p reports
          for version in baseline candidate; do
            (
              cd "$version"
              /usr/bin/time -p -o "../reports/$version-time.txt" \
                node scripts/combat-motion-baseline.cjs 90 > "../reports/$version-combat.json"
            )
          done
      - name: Report comparison
        run: |
          if cmp -s reports/baseline-combat.json reports/candidate-combat.json; then
            echo 'Combat reference: identical' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'Combat reference differs; review the JSON artifacts.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          for version in baseline candidate; do
            echo "### $version timing" >> "$GITHUB_STEP_SUMMARY"
            cat "reports/$version-time.txt" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Diagnose candidate formatting
        working-directory: candidate
        run: |
          npm run format > /tmp/navigation-reference-format.log
          git diff --exit-code
      - name: Upload reference results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-collision-reference
          path: reports/
          retention-days: 90
