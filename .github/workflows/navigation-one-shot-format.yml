name: Navigation one-shot format and check

on:
  push:
    branches:
      - feature/navigation-danger-crew-replanning

permissions:
  contents: write

jobs:
  format-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/navigation-danger-crew-replanning
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier settings
        run: npm run format
      - name: Commit formatting to the implementation branch
        run: |
          if ! git diff --quiet; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add -u
            git commit -m "style(navigation): apply repository Prettier configuration"
            git push origin HEAD:feature/navigation-danger-crew-replanning
          fi
      - name: Validate typed code, lint, tests and dependencies
        run: npm run check:quick
