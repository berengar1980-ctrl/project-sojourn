name: PR304 one-time persistence formatting and tests
on:
  push:
    branches: [feat/career-save-foundation-300]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Dependencies
        run: npm ci --no-audit --no-fund
      - name: Format changed files
        run: |
          npx prettier --write src/systems/persistence/*.ts
          npx prettier --write src/app/game-controller-economy.ts
          npx prettier --write src/systems/operations/asteroid-field-world.ts
          npx prettier --write tests/persistence/*.test.cjs
          npx prettier --write docs/CAREER_PERSISTENCE.md docs/CAMPAIGN_ARCHITECTURE.md docs/SOJOURN_FEATURE_PARITY.md
      - name: Strict TS
        run: npm run typecheck
      - name: Focused persistence tests
        run: |
          node tests/persistence/career-save-store.test.cjs
          node tests/persistence/career-operational-registries.test.cjs
      - name: Format and remove temporary workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/issue300-career-format-once.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "style: format career checkpoint foundation and remove temporary CI workflow"
          git push origin HEAD:feat/career-save-foundation-300
