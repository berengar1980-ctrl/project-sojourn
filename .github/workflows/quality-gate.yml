name: Sojourn quality gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    if: ${{ true }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout with main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check Prettier
        run: npm run format:check
      - name: Check ESLint
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Check dependency architecture
        run: npm run deps:check
      - name: Check Career persistence architecture
        run: npm run persistence:check
      - name: Run all project tests
        run: npm test
      - name: Run economy horizons (90/180/365 days)
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.action == 'labeled' && github.event.label.name == 'economy-audit')
        run: npm run test:economy-horizons
      - name: Integrated economy smoke (3 days)
        if: github.event_name == 'pull_request'
        env:
          SOJOURN_INTEGRATED_FIELDS: '1'
          SOJOURN_LONGRUN_DAYS: '3'
        run: node tests/economy/npc-economy-longrun.test.cjs
      - name: Build production bundle
        run: npm run build
