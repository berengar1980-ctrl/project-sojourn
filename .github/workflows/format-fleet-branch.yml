name: Temporary FleetCombat formatter
on:
  push:
    branches:
      - fix/fleet-survivor-reassignment-stall
concurrency:
  group: fleet-format-final
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/systems/combat/star-map-engagement-service.ts src/systems/combat/star-map-engagement-fleet-resolution.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/systems/combat/star-map-engagement-service.ts src/systems/combat/star-map-engagement-fleet-resolution.ts
            git commit -m "style: format career fleet result bridge"
            git pull --rebase origin fix/fleet-survivor-reassignment-stall
            git push
          fi
