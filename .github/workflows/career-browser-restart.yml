name: Career browser restart smoke

on:
  pull_request:
    paths:
      - 'scripts/browser-career-restart.cjs'
      - '.github/workflows/career-browser-restart.yml'
      - 'src/app/bootstrap.ts'
      - 'src/app/game-controller-career-*.ts'
      - 'src/systems/persistence/**'
      - 'src/ui/settings/settings-menu.ts'
      - 'src/ui/start/**'
  push:
    branches:
      - main
    paths:
      - 'scripts/browser-career-restart.cjs'
      - '.github/workflows/career-browser-restart.yml'
      - 'src/app/bootstrap.ts'
      - 'src/app/game-controller-career-*.ts'
      - 'src/systems/persistence/**'
      - 'src/ui/settings/settings-menu.ts'
      - 'src/ui/start/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-restart:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install isolated browser-test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Build game
        run: npm run build
      - name: Start local game
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/sojourn-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sojourn-vite.log
          exit 1
      - name: Verify real Save / browser reload / Continue
        run: node scripts/browser-career-restart.cjs
      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: career-browser-failure
          path: career-browser-failure.png
          if-no-files-found: ignore
