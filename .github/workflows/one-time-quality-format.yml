name: One-time format existing main CI failures
on:
  push:
    branches:
      - fix/main-quality-gate-after-pr230
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format the actual repository sources
        run: npm run format
      - name: Commit formatted files, if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: apply Prettier across merged PR 230"
            git push origin HEAD:fix/main-quality-gate-after-pr230
          fi
