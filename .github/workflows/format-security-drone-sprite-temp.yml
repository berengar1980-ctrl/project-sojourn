name: Temporary drone sprite test formatter
on:
  push:
    branches:
      - feat/persistent-salvage-security-drone
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/persistent-salvage-security-drone
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/ui/security-drone-sprite.test.cjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui/security-drone-sprite.test.cjs
          if ! git diff --cached --quiet; then
            git commit -m "Format security drone sprite regression test"
            git push origin HEAD:feat/persistent-salvage-security-drone
          fi
