name: Quality

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Format debug
        run: |
          npx prettier --write src/ui/space/procedural-space-body-renderer.ts tests/map/procedural-space-bodies.test.cjs
          echo '---BEGIN_SPACE_BODY_TS---'
          cat src/ui/space/procedural-space-body-renderer.ts
          echo '---END_SPACE_BODY_TS---'
          echo '---BEGIN_SPACE_BODY_TEST---'
          cat tests/map/procedural-space-bodies.test.cjs
          echo '---END_SPACE_BODY_TEST---'
      - name: Quality gate
        run: npm run check
