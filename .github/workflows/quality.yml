name: Quality

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Show Prettier diff
        run: |
          npm run format
          git diff -- src/systems/local-space/mining-impact.ts src/ui/local-space/local-space-renderer.ts src/ui/local-space/mining-effects-renderer.ts src/ui/map/player-ship-renderer.ts src/ui/ships/ship-engine-effects-renderer.ts src/ui/ships/ship-hardpoint-projector.ts tests/map/player-ship-rendering.test.cjs
          exit 1
