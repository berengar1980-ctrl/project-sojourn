name: Quality

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Format diff
        run: |
          npx prettier --write src/app/game-controller.ts src/core/local-space-types.ts src/features/local-space/local-space-view-model.ts src/systems/local-space/index.ts src/systems/local-space/local-space-navigation.ts src/systems/local-space/local-space-route-worker-client.ts src/systems/local-space/local-space-route-worker.ts src/systems/local-space/local-space-service.ts src/ui/local-space/local-space-input.ts src/ui/local-space/local-space-panel.ts src/ui/local-space/local-space-renderer.ts tests/local-space/local-space-rendering.test.cjs tests/local-space/local-space.test.cjs
          git diff -- src/app/game-controller.ts src/core/local-space-types.ts src/features/local-space/local-space-view-model.ts src/systems/local-space/index.ts src/systems/local-space/local-space-navigation.ts src/systems/local-space/local-space-route-worker-client.ts src/systems/local-space/local-space-route-worker.ts src/systems/local-space/local-space-service.ts src/ui/local-space/local-space-input.ts src/ui/local-space/local-space-panel.ts src/ui/local-space/local-space-renderer.ts tests/local-space/local-space-rendering.test.cjs tests/local-space/local-space.test.cjs
      - name: Quality gate
        run: npm run check
