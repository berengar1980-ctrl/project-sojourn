name: Quality

on:
  push:
    branches:
      - feature/ship-weapons-mines-mk1-mk6
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Quality gate
        run: npm run check
