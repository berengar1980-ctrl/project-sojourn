name: Quality

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Show Prettier diff
        run: |
          npm run format
          git diff -- src/systems/local-space/local-space-navigation.ts src/systems/local-space/local-space-service.ts src/ui/local-space/local-space-panel.ts tests/local-space/local-space-rendering.test.cjs
          exit 1
