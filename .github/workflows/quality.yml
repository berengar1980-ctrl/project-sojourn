name: Quality

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Format debug
        run: |
          npx prettier --write src/ui/space/procedural-surface-textures.ts
          git diff -- src/ui/space/procedural-surface-textures.ts
      - name: Quality gate
        run: npm run check
