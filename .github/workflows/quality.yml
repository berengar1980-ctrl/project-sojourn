name: Quality

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Format diff
        run: |
          npx prettier --write tests/local-space/local-space-rendering.test.cjs tests/map/procedural-space-bodies.test.cjs
          git diff -- tests/local-space/local-space-rendering.test.cjs tests/map/procedural-space-bodies.test.cjs
      - name: Quality gate
        run: npm run check
