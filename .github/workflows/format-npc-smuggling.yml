name: One-time Prettier for NPC smuggling
on:
  push:
    branches:
      - feature/voidbound-npc-smuggling-notices
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/voidbound-npc-smuggling-notices
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Format NPC smuggling refactor
        run: |
          npx prettier --write src/data/economy/sector-npc-economy.ts src/systems/economy/npc-smuggling-service.ts src/systems/economy/npc-smuggling-inspection.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style(smuggling): format extracted inspection and NPC service"
            git push origin HEAD:feature/voidbound-npc-smuggling-notices
          fi
