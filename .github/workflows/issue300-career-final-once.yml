name: One-time PR304 final save validation
on:
  push:
    branches: [feat/career-save-foundation-300]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/systems/persistence/career-operational-registries.ts tests/persistence/career-operational-registries.test.cjs
      - run: npm run lint
      - run: npm run typecheck
      - name: Save domain regressions
        run: |
          node tests/persistence/career-save-store.test.cjs
          node tests/persistence/career-operational-registries.test.cjs
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/issue300-career-final-once.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "ci: format complete claim restore validation and remove helper"
          git push origin HEAD:feat/career-save-foundation-300
