name: Career integration full checkpoint diagnostics

on:
  push:
    branches:
      - feat/career-economy-npc-trade-integrity
    paths:
      - .github/workflows/career-focused-tests-once.yml

permissions:
  contents: read

jobs:
  career-focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate format and TypeScript
        run: npm run format:check && npm run typecheck
      - name: All bounded Career checkpoint tests
        run: node tests/run-tests.cjs career
      - name: Production build
        run: npm run build
