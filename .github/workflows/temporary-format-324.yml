name: Temporary PR 324 formatter
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  prettier:
    if: github.event.pull_request.number == 324 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write src/app/game-controller-salvage-npc-runtime.ts src/app/game-controller-salvage.ts src/app/game-controller.ts src/systems/operations/ship-operation-permissions.ts src/systems/operations/wreck-claim-registry.ts src/systems/persistence/career-operational-registries.ts src/ui/operations/operations-panel.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/app/game-controller-salvage-npc-runtime.ts src/app/game-controller-salvage.ts src/app/game-controller.ts src/systems/operations/ship-operation-permissions.ts src/systems/operations/wreck-claim-registry.ts src/systems/persistence/career-operational-registries.ts src/ui/operations/operations-panel.ts
            git commit -m "style: format wreck claim changes with Prettier"
            git push origin HEAD:"${{ github.head_ref }}"
          fi
