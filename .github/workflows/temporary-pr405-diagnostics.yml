name: Temporary Sojourn diagnostics PR 405
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  diagnostics:
    if: github.head_ref == 'fix/npc-combat-logic'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format changed files and show patch
        run: |
          git diff --name-only --diff-filter=ACM -z origin/main HEAD | xargs -0 -r npx prettier --write --ignore-unknown
          git diff --no-ext-diff
      - name: TypeScript
        if: always()
        run: npm run typecheck
      - name: ESLint
        if: always()
        run: npm run lint
      - name: Dependency architecture
        if: always()
        run: npm run deps:check
      - name: Persistence architecture
        if: always()
        run: npm run persistence:check
      - name: Campaign preset parity
        if: always()
        run: node tests/combat/combat-campaign-preset-parity.test.cjs
      - name: Salvage event stock regression
        if: always()
        run: node tests/economy/salvage-event-physical-stock.test.cjs
      - name: Physical ledger regression
        if: always()
        run: node tests/economy/physical-resource-horizons.test.cjs
      - name: Previously failing targeted regressions
        if: always()
        run: |
          node tests/combat/pirate-interception-policy.test.cjs
          node tests/local-space/local-pirate-background-continuity.test.cjs
          node tests/local-space/combat-wreck-interaction.test.cjs
          node tests/operations/drone-patrol-routing-regression.test.cjs
          node tests/operations/security-drone-debris-shield-mk3.test.cjs
          node tests/quality/architecture.test.cjs
          node tests/quality/feature-parity.test.cjs
      - name: Integrated economy smoke (3 days)
        if: always()
        env:
          SOJOURN_INTEGRATED_FIELDS: '1'
          SOJOURN_LONGRUN_DAYS: '3'
          SOJOURN_PROFILE: '1'
        run: node tests/economy/npc-economy-longrun.test.cjs
      - name: Wreck snapshot isolation regression
        if: always()
        run: node tests/operations/wreck-claim-registry.test.cjs
  combat-balance:
    if: github.head_ref == 'fix/npc-combat-logic'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/audit-security-drone-combat.cjs 100
      - name: Trial central durability values (no game changes)
        run: |
          for drone in '20 10' '40 20' '60 0'; do
            read -r dh ds <<< "$drone"
            for marauder in '0 0' '60 30' '120 60'; do
              read -r mh ms <<< "$marauder"
              echo "CANDIDATE drone hull+$dh shield+$ds marauder hull+$mh shield+$ms"
              AUDIT_DRONE_HULL="$dh" AUDIT_DRONE_SHIELD="$ds" AUDIT_MARAUDER_HULL="$mh" AUDIT_MARAUDER_SHIELD="$ms" node scripts/audit-security-drone-combat.cjs 100
            done
          done
  performance-benchmark:
    if: >-
      github.head_ref == 'fix/npc-combat-logic' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'performance-benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install identical locked environments
        run: |
          npm ci --prefix baseline
          npm ci --prefix candidate
      - name: Baseline 3/10/30-day benchmark
        working-directory: baseline
        continue-on-error: true
        run: |
          for days in 3 10 30; do
            echo "BASELINE days=$days"
            /usr/bin/time -v env SOJOURN_INTEGRATED_FIELDS=1 SOJOURN_LONGRUN_DAYS="$days" node tests/economy/npc-economy-longrun.test.cjs
          done
      - name: Candidate 3/10/30-day benchmark and CPU profile
        working-directory: candidate
        run: |
          mkdir -p profiles
          for days in 3 10 30; do
            echo "CANDIDATE days=$days"
            /usr/bin/time -v env SOJOURN_INTEGRATED_FIELDS=1 SOJOURN_LONGRUN_DAYS="$days" SOJOURN_PROFILE=1 node --cpu-prof --cpu-prof-dir=profiles tests/economy/npc-economy-longrun.test.cjs
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sojourn-pr405-cpu-profiles
          path: candidate/profiles
