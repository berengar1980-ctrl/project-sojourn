name: Feature Parity Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  feature-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Voidbound parity review
        run: node scripts/check-feature-parity.cjs --base "origin/${{ github.base_ref }}"
