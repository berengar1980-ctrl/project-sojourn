name: One-time world-law acceptance retry
on:
  push:
    branches: [test/integration-world-law-300]
permissions:
  contents: write
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: World-law integration and targeted regressions
        run: |
          node tests/operations/world-law-integration.test.cjs
          node tests/operations/asteroid-field-world.test.cjs
          node tests/operations/background-drone-security.test.cjs
          node tests/operations/legal-claims-settlement.test.cjs
      - name: Cleanup test helper
        if: always()
        run: |
          rm -f .github/workflows/issue300-world-law-retry-once.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "ci: remove temporary world-law verification"
          git push origin HEAD:test/integration-world-law-300
