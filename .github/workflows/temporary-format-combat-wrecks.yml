name: Temporary format combat wreck branch
on:
  push:
    branches:
      - feat/random-salvageable-combat-wrecks
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/random-salvageable-combat-wrecks
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/core/salvage-types.ts src/systems/combat/strategic-combat-types.ts src/systems/combat/field-combat-arena.ts src/features/salvage/salvage-space-view-model.ts src/systems/salvage/combat-destruction-wreck.ts src/ui/salvage/combat-wreck-mesh.ts src/ui/salvage/salvage-space-renderer.ts src/ui/combat/combat-scrap-renderer.ts src/systems/salvage/salvage-container-motion.ts src/systems/combat/combat-visible-collider.ts src/app/game-controller-combat-resolution.ts tests/salvage/combat-destruction-wreck.test.cjs
      - name: Commit formatted files if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: format combat wreck integration"
            git push origin HEAD:feat/random-salvageable-combat-wrecks
          fi
