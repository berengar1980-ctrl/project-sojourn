name: Temporary PR 327 formatter
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  prettier:
    if: github.event.pull_request.number == 327 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/game-controller-world-events.ts src/ui/map/star-map-event-filters.ts src/ui/map/star-map-mission-pane.ts src/ui/map/star-map-world-events.ts src/ui/styles/star-map-menu.css tests/map/star-map-world-events.test.cjs
      - name: Commit formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/app/game-controller-world-events.ts src/ui/map/star-map-event-filters.ts src/ui/map/star-map-mission-pane.ts src/ui/map/star-map-world-events.ts src/ui/styles/star-map-menu.css tests/map/star-map-world-events.test.cjs
            git commit -m "style: format extended star map events"
            git push origin HEAD:"${{ github.head_ref }}"
          fi
