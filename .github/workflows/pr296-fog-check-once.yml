name: PR296 organic danger fog one-shot validation
on:
  push:
    branches: [fix/organic-danger-nebula-fullscreen]
    paths: [.github/workflows/pr296-fog-check-once.yml]
permissions:
  contents: write
jobs:
  fog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/organic-danger-nebula-fullscreen
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Format changed fog files to project rules
        run: npx prettier --write src/ui/map/star-map-danger-fog-field.ts src/ui/map/star-map-danger-regions.ts tests/map/organic-danger-fog.test.cjs tests/navigation/curated-danger-corridors.test.cjs docs/SOJOURN_FEATURE_PARITY.md
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git add -u
            git commit -m "style(map): format full-viewport organic nebula implementation"
            git push origin HEAD:fix/organic-danger-nebula-fullscreen
          fi
      - name: Check TypeScript lint and architecture
        run: |
          npm run lint
          npm run typecheck
          npm run deps:check
      - name: Verify full-canvas coverage organic fog and navigation invariance
        run: |
          node tests/map/organic-danger-fog.test.cjs
          node tests/navigation/curated-danger-corridors.test.cjs
          node tests/navigation/danger-routing.test.cjs
          node tests/map/tutorial-map.test.cjs
      - name: Full quick regression suite
        run: npm run test:quick
