name: Temporary wreck source formatter
on:
  push:
    branches:
      - feature/combat-wrecks-main-rebased-20261124
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/ui/salvage/combat-wreck-geometry.ts src/ui/salvage/combat-wreck-mesh.ts src/core/combat-wreck-variant.ts src/systems/operations/asteroid-field-world.ts docs/SOJOURN_FEATURE_PARITY.md
      - name: Commit formatted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/salvage/combat-wreck-geometry.ts src/ui/salvage/combat-wreck-mesh.ts src/core/combat-wreck-variant.ts src/systems/operations/asteroid-field-world.ts docs/SOJOURN_FEATURE_PARITY.md
          git diff --cached --quiet || git commit -m "Format five combat wreck model changes"
          git push
