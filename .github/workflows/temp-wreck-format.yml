name: Temporary wreck mesh formatting
on:
  push:
    branches:
      - feature/combat-destruction-five-wreck-models-20261124
jobs:
  format-wreck:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/ui/salvage/combat-wreck-mesh.ts
      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/salvage/combat-wreck-mesh.ts
          git diff --cached --quiet || git commit -m "Format wreck mesh source with Prettier"
          git push
