name: Temporary combat wreck formatter
on:
  push:
    branches:
      - fix/combat-wreck-tumble-detail-20261124
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/ui/salvage/combat-wreck-details.ts src/ui/salvage/combat-wreck-mesh.ts src/ui/combat/combat-scrap-renderer.ts src/ui/combat/combat-wreck-destruction-renderer.ts src/ui/local-space/local-combat-wreck-renderer.ts tests/salvage/combat-wreck-animation.test.cjs docs/CAREER_PERSISTENCE.md docs/SOJOURN_FEATURE_PARITY.md
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/salvage/combat-wreck-details.ts src/ui/salvage/combat-wreck-mesh.ts src/ui/combat/combat-scrap-renderer.ts src/ui/combat/combat-wreck-destruction-renderer.ts src/ui/local-space/local-combat-wreck-renderer.ts tests/salvage/combat-wreck-animation.test.cjs docs/CAREER_PERSISTENCE.md docs/SOJOURN_FEATURE_PARITY.md
          git diff --cached --quiet || git commit -m "Format combat wreck animation and detail sources"
          git push
