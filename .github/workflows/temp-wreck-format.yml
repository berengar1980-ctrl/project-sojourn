name: Temporary wreck rendering formatter
on:
  push:
    branches:
      - fix/fleet-wreck-visibility-scale-two-thirds-20261124
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/ui/combat/fleet-field-wreck-renderer.ts src/ui/combat/fleet-native-combat-renderer.ts src/ui/salvage/combat-wreck-mesh.ts tests/combat/fleet-wreck-field-rendering.test.cjs tests/salvage/combat-wreck-animation.test.cjs docs/CAREER_PERSISTENCE.md docs/SOJOURN_FEATURE_PARITY.md
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/combat/fleet-field-wreck-renderer.ts src/ui/combat/fleet-native-combat-renderer.ts src/ui/salvage/combat-wreck-mesh.ts tests/combat/fleet-wreck-field-rendering.test.cjs tests/salvage/combat-wreck-animation.test.cjs docs/CAREER_PERSISTENCE.md docs/SOJOURN_FEATURE_PARITY.md
          git diff --cached --quiet || git commit -m "Format fleet wreck visibility and scale fix"
          git push
