name: Career restart test exact Prettier once

on:
  push:
    branches:
      - test/career-save-restart-continuity
    paths:
      - .github/workflows/career-restart-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/career-save-restart-continuity
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply exact repository formatting to new simulation test
        run: |
          npx prettier --write tests/persistence/career-full-session.test.cjs
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/persistence/career-full-session.test.cjs
            git commit -m "Format Career restart and economy continuity simulations"
            git push origin HEAD:test/career-save-restart-continuity
          fi
