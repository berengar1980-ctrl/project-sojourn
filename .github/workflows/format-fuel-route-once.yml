name: One-time fuel route test formatter

on:
  push:
    branches:
      - feature/fuel-aware-player-npc-routing
    paths:
      - .github/workflows/format-fuel-route-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/systems/navigation/fuel-route-planner.ts tests/navigation/fuel-aware-route.test.cjs
      - name: Save canonical formatting to feature branch
        run: |
          if ! git diff --quiet -- src/systems/navigation/fuel-route-planner.ts tests/navigation/fuel-aware-route.test.cjs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/systems/navigation/fuel-route-planner.ts tests/navigation/fuel-aware-route.test.cjs
            git commit -m 'style(tests): apply Prettier to fuel itinerary tests'
            git push origin HEAD:feature/fuel-aware-player-npc-routing
          fi
