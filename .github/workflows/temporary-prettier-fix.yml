name: Temporary Prettier Fix
on:
  push:
    branches:
      - fix/cargo-scanner-route-visualization
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[formatted]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cargo-scanner-route-visualization
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/ui/map/star-map-cargo-scanner.ts src/ui/styles.css
      - name: Commit formatted output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/map/star-map-cargo-scanner.ts src/ui/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "style: apply exact Prettier formatting [formatted]"
            git push origin HEAD:fix/cargo-scanner-route-visualization
          fi
