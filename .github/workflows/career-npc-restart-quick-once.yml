name: Career NPC and trade restart focused simulation

on:
  push:
    branches:
      - test/career-save-restart-continuity
    paths:
      - .github/workflows/career-npc-restart-quick-once.yml

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node tests/persistence/career-npc-checkpoint.test.cjs
      - run: node tests/persistence/career-full-session.test.cjs
