name: Temporary combat wreck formatting
on:
  push:
    branches: [feat/combat-wreck-world-and-unobstructed-results]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/combat-wreck-world-and-unobstructed-results
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/systems/operations/asteroid-field-world.ts
      - name: Commit formatted file
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "style: format field wreck checkpoint"
            git push origin HEAD:feat/combat-wreck-world-and-unobstructed-results
          fi
