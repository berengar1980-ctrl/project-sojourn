name: Temporary combat wreck formatting
on:
  push:
    branches: [feat/combat-wreck-world-and-unobstructed-results]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/combat-wreck-world-and-unobstructed-results
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/game-controller-combat-resolution.ts src/app/game-controller-location-entry.ts src/app/game-controller.ts src/systems/combat/field-combat-arena.ts src/systems/operations/asteroid-field-world.ts src/ui/combat/campaign-combat-summary.ts src/ui/local-space/local-combat-wreck-renderer.ts tests/persistence/career-field-world-session.test.cjs
      - name: Commit formatted changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: format combat wreck integration"
            git push origin HEAD:feat/combat-wreck-world-and-unobstructed-results
          fi
