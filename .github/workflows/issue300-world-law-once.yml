name: One-time world-law integration diagnosis
on:
  push:
    branches: [test/integration-world-law-300]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format new test
        run: npx prettier --write tests/operations/world-law-integration.test.cjs docs/SOJOURN_FEATURE_PARITY.md
      - name: Integration scenario
        run: node tests/operations/world-law-integration.test.cjs
      - name: Cleanup diagnostic workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/issue300-world-law-once.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "test: format and verify world-law integration"
          git push origin HEAD:test/integration-world-law-300
