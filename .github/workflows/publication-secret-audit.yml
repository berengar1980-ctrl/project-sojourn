name: Publication secret audit

on:
  pull_request:
    paths:
      - '.github/workflows/publication-secret-audit.yml'
      - 'COPYRIGHT.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-history:
    name: Scan current tree and complete fetched Git history
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch remaining refs for history audit
        run: git fetch --all --tags --force
      - name: Check for credential material in all fetched Git history
        run: |
          if docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git --log-opts="--all" --redact --no-banner /repo >/tmp/sojourn-gitleaks-history.log 2>&1; then
            echo "PASS: No Gitleaks findings across fetched Git history."
          else
            echo "::error::Potential credential detected in Git history or scanner could not complete. Do NOT make the repository public. Review /tmp/sojourn-gitleaks-history.log in a secure environment."
            exit 1
          fi
      - name: Check current working tree
        run: |
          if docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 dir --redact --no-banner /repo >/tmp/sojourn-gitleaks-tree.log 2>&1; then
            echo "PASS: No Gitleaks findings in current working tree."
          else
            echo "::error::Potential credential in current tree or scanner error. Review locally before publication."
            exit 1
          fi
