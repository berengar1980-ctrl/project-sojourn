name: One-time system Chrome campaign smoke
on:
  push:
    branches: [test/integration-world-law-300]
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Use runner Chrome without Playwright browser download
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          command -v google-chrome || command -v google-chrome-stable || command -v chromium || exit 1
      - name: Open actual campaign
        env:
          SOJOURN_CHROME_CHANNEL: chrome
        run: node tests/browser/campaign-startup.smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sojourn-campaign-chrome-smoke
          path: /tmp/sojourn-campaign-startup.png
          if-no-files-found: ignore
      - name: Remove one-time workflow and format smoke
        if: always()
        run: |
          npx prettier --write tests/browser/campaign-startup.smoke.cjs
          git checkout -- package-lock.json
          rm -f .github/workflows/issue300-system-chrome-once.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "ci: format browser smoke and remove temporary runner"
          git push origin HEAD:test/integration-world-law-300
