name: One-time Chromium campaign smoke
on:
  push:
    branches: [test/integration-world-law-300]
permissions:
  contents: write
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install temporary browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Run actual campaign in Chromium
        run: node tests/browser/campaign-startup.smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sojourn-campaign-smoke
          path: /tmp/sojourn-campaign-startup.png
          if-no-files-found: ignore
      - name: Format new browser smoke and remove helper
        if: always()
        shell: bash
        run: |
          npx prettier --write tests/browser/campaign-startup.smoke.cjs
          git checkout -- package-lock.json
          rm -f .github/workflows/issue300-browser-smoke-once.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "test: format Chromium smoke and remove one-time helper"
          git push origin HEAD:test/integration-world-law-300
