t-weapon-physics.test.cjs tests/combat/fleet-native-specials.test.cjs tests/combat/fleet-security-drone-interceptor.test.cjs tests/combat/fleet-drone-prototype.test.cjs tests/combat/fleet-shared-runtime-boundary.test.cjs tests/combat/fleet-career-state-handoff.test.cjs tests/combat/fleet-career-npc-adapter.test.cjs tests/combat/fleet-career-mining-bridge.test.cjs tests/combat/fleet-career-field-entry.test.cjs tests/combat/fleet-career-field-security-bridge.test.cjs tests/combat/fleet-career-hostile-contacts.test.cjs tests/combat/fleet-career-loot-settlement.test.cjs tests/combat/fleet-career-wreck-settlement.test.cjs tests/combat/fleet-career-pirate-crossfaction.test.cjs tests/combat/fleet-field-tick-ownership.test.cjs tests/combat/fleet-career-save-policy.test.cjs tests/audio/game-audio.test.cjs tests/combat/fleet-mining-test-setup.test.cjs tests/combat/fleet-legacy-baseline.test.cjs tests/combat/fleet-legacy-diff.test.cjs
          git commit -m "style(fleet): apply repository Prettier formatting"
          git push origin HEAD:feature/fleetcombat-existing-career-maps
