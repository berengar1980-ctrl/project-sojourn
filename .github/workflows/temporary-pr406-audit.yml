name: Temporary PR 406 performance and economy audit

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  paired-benchmark:
    if: github.head_ref == 'perf/simulation-tick-optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install locked dependencies
        run: |
          npm ci --prefix baseline
          npm ci --prefix candidate
      - name: Compare identical integrated simulation scenarios
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          for round in 1 2 3; do
            if [ "$round" = 2 ]; then order="candidate baseline"; else order="baseline candidate"; fi
            for checkout in $order; do
              echo "BENCHMARK round=$round checkout=$checkout"
              (
                cd "$checkout"
                /usr/bin/time -f 'BENCHMARK wall=%e cpu_user=%U cpu_system=%S rss_kib=%M' \
                  env SOJOURN_INTEGRATED_FIELDS=1 SOJOURN_LONGRUN_DAYS=3 SOJOURN_PROFILE=1 \
                  node tests/economy/npc-economy-longrun.test.cjs
              ) 2>&1 | tee "benchmark-results/$checkout-$round.log"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr406-paired-benchmark
          path: benchmark-results
  economy-audit:
    if: github.head_ref == 'perf/simulation-tick-optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Full economy and physical field reconciliation
        run: npm run test:economy-horizons
