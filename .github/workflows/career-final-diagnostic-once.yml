name: Career final integration diagnostics once

on:
  push:
    branches:
      - feat/career-economy-npc-trade-integrity
    paths:
      - .github/workflows/career-final-diagnostic-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/career-economy-npc-trade-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Apply repository Prettier automatically
        run: |
          npm run format
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "Apply Prettier to final Career Save architecture fixes"
            git push origin HEAD:feat/career-economy-npc-trade-integrity
          fi
      - name: Collect full quality diagnostics
        shell: bash
        run: |
          failed=0
          for command in "npm run format:check" "npm run lint" "npm run typecheck" "npm run deps:check" "npm run persistence:check" "npm test" "npm run build"; do
            echo "::group::$command"
            if timeout 180s bash -lc "$command"; then
              echo "PASS $command"
            else
              echo "FAIL $command"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done
          echo "Failures: $failed"
          test "$failed" -eq 0
