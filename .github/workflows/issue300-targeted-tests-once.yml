name: PR301 one-time targeted diagnostic
on:
  push:
    branches: [refactor/background-asteroid-world-300]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Run focused regression tests
        id: tests
        shell: bash
        run: |
          failed=0
          for file in             tests/local-space/local-space-rendering.test.cjs             tests/local-space/npc-mining-traffic.test.cjs             tests/operations/asteroid-field-world.test.cjs             tests/operations/background-drone-security.test.cjs             tests/operations/asteroid-security-drone.test.cjs             tests/operations/controller-operations-integration.test.cjs             tests/operations/local-pirate-traffic.test.cjs; do
            echo "::group::TEST $file"
            node "$file" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Remove one-time helper from branch
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/issue300-targeted-tests-once.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "ci: remove one-time PR301 targeted diagnostics"
          git push origin HEAD:refactor/background-asteroid-world-300
