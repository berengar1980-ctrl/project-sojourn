name: Temporary format combat wreck refactors
on:
  push:
    branches: [fix/combat-wreck-click-and-drift]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/combat-wreck-click-and-drift
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/game-controller-field-world-bridge.ts src/ui/local-space/local-space-panel.ts
      - name: Commit formatted files
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "style: format battle wreck refactor"
            git push origin HEAD:fix/combat-wreck-click-and-drift
          fi
