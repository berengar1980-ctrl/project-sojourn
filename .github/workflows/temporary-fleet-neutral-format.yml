name: Temporary Fleet civilian formatting
on:
  push:
    branches:
      - refactor/unify-all-combat-and-npc-runtime
permissions:
  contents: write
concurrency:
  group: fleet-civilian-format
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format affected sources and regression tests
        run: |
          npx prettier --write src/ui/start/fleet-scenario-roster.ts src/ui/start/fleet-scenario-runtime.ts src/ui/start/fleet-scenario-world-bridge.ts src/systems/combat/native-fleet-advance.ts src/systems/combat/parallel-native-duels.ts tests/combat/fleet-campaign-scenario.test.cjs tests/combat/unified-native-world-handoff.test.cjs
      - name: Commit
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: canonical format for civilian fleet roles and physical contacts"
            git pull --rebase origin refactor/unify-all-combat-and-npc-runtime
            git push
          fi
