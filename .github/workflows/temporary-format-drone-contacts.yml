name: Temporary drone contact test formatting
on:
  push:
    branches: [fix/security-drone-solid-contacts-scale]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-drone-solid-contacts-scale
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/operations/security-drone-solid-contacts.test.cjs
      - name: Commit formatted test
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests
            git commit -m "style: format security drone collision test"
            git push origin HEAD:fix/security-drone-solid-contacts-scale
          fi
