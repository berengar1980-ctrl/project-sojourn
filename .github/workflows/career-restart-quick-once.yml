name: Career restart simulation focused diagnostic (correct ship API)

on:
  push:
    branches:
      - test/career-save-restart-continuity
    paths:
      - .github/workflows/career-restart-quick-once.yml

permissions:
  contents: read

jobs:
  simulate-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node tests/persistence/career-full-session.test.cjs
