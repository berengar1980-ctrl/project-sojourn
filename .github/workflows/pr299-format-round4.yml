name: One-time PR299 format after lint corrections
on:
  push:
    branches: [feature/asteroid-claims-foundation]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - run: npm run format:check
      - run: |
          rm .github/workflows/pr299-format-round4.yml
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "style: prettify combat refactors"
          git push origin HEAD:feature/asteroid-claims-foundation
