name: Temporary PR 325 formatter
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  prettier:
    if: github.event.pull_request.number == 325 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write src/ui/map/star-map-event-filters.ts src/ui/map/star-map-menu-content.ts src/ui/map/star-map-panel.ts src/ui/styles/star-map-menu.css
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/ui/map/star-map-event-filters.ts src/ui/map/star-map-menu-content.ts src/ui/map/star-map-panel.ts src/ui/styles/star-map-menu.css
            git commit -m "style: format event filtering UI with Prettier"
            git push origin HEAD:"${{ github.head_ref }}"
          fi
