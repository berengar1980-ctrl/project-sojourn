name: Temporary drone performance formatter
on:
  push:
    branches:
      - fix/drone-patrol-performance-enforcement
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/drone-patrol-performance-enforcement
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/game-controller-drone-pirate-response.ts src/app/game-controller-economy.ts src/app/game-controller-salvage-drone.ts src/app/game-controller-salvage-event-progress.ts src/app/game-controller-salvage-legal-response.ts src/app/game-controller-salvage-npc-view.ts src/app/game-controller-salvage-pirate-combat.ts src/app/game-controller-salvage-pirates.ts src/app/game-controller-salvage-security-actions.ts src/app/game-controller-salvage.ts src/app/game-controller.ts src/systems/navigation/field-patrol-route.ts src/systems/operations/asteroid-security-drone.ts tests/operations/drone-patrol-routing-regression.test.cjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/ src/systems/navigation/field-patrol-route.ts src/systems/operations/asteroid-security-drone.ts tests/operations/drone-patrol-routing-regression.test.cjs
          if ! git diff --cached --quiet; then
            git commit -m "Apply project Prettier formatting to drone enforcement"
            git push origin HEAD:fix/drone-patrol-performance-enforcement
          fi
