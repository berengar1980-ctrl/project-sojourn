name: Temporary drone performance formatter
on:
  push:
    branches:
      - fix/drone-patrol-performance-enforcement
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/drone-patrol-performance-enforcement
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/game-controller-drone-pirate-response.ts src/app/game-controller-salvage.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/game-controller-drone-pirate-response.ts src/app/game-controller-salvage.ts
          if ! git diff --cached --quiet; then
            git commit -m "Format pirate response and salvage scene"
            git push origin HEAD:fix/drone-patrol-performance-enforcement
          fi
