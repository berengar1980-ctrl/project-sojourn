name: One-time final formatting for issue 300
on:
  push:
    branches:
      - refactor/background-asteroid-world-300
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - run: npm run format:check
      - run: |
          rm -f .github/workflows/issue300-final-format-once.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "style: format field combat recovery and drone regressions"
          git push origin HEAD:refactor/background-asteroid-world-300
