name: Temporary shared combat formatter
on:
  push:
    branches:
      - refactor/unify-all-combat-and-npc-runtime
concurrency:
  group: unified-combat-formatter
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply repository formatter
        run: |
          npx prettier --write             src/systems/combat/parallel-native-duels.ts             src/systems/combat/career-fleet-encounter.ts             src/systems/combat/star-map-engagement-service.ts             src/ui/start/fleet-scenario-world-bridge.ts             src/ui/start/fleet-scenario-runtime.ts             src/ui/start/fleet-test-lobby.ts             src/ui/combat/fleet-world-contact-overlay.ts             src/ui/combat/fleet-native-combat-panel.ts             src/ui/local-space/local-space-renderer.ts             src/ui/start/duel-lobby.ts             src/app/game-controller-combat-scene.ts             tests/combat/fleet-campaign-scenario.test.cjs             tests/combat/unified-native-world-handoff.test.cjs
      - name: Commit formatted changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src tests
            git commit -m "style: format shared combat and career NPC integration"
            git pull --rebase origin refactor/unify-all-combat-and-npc-runtime
            git push
          fi
