name: Temporary native renderer formatter
on:
  push:
    branches:
      - refactor/unify-all-combat-and-npc-runtime
permissions:
  contents: write
concurrency:
  group: native-renderer-format
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format shared renderer and test parity
        run: |
          npx prettier --write src/ui/combat/fleet-native-ship-sprites.ts src/ui/combat/fleet-native-combat-renderer.ts src/ui/local-space/local-space-renderer.ts src/ui/salvage/salvage-space-renderer.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/ui/combat src/ui/local-space src/ui/salvage
            git commit -m "style: canonical native fleet renderer and camera lifecycle"
            git pull --rebase origin refactor/unify-all-combat-and-npc-runtime
            git push
          fi
