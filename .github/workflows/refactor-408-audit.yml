name: Refactor 408 - 90 day comparison

on:
  pull_request:
    branches: [refactor/shared-project-rules]
    paths:
      - '.github/workflows/refactor-408-audit.yml'

permissions:
  contents: read

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        revision:
          - { name: baseline, sha: da892c0c3b0f3eccf78dceaa9029a4eb01faeca2 }
          - { name: refactored, sha: 8b854699d7320cb19524a1e0ab9474051173e53d }
        mode: [strategic, physical, integrated]
    name: ${{ matrix.revision.name }} / ${{ matrix.mode }} / 90d
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOJOURN_AUDIT_MODE: ${{ matrix.mode }}
      SOJOURN_AUDIT_DAYS: '90'
      SOJOURN_PROFILE: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run pinned 90 day economy audit
        shell: bash
        run: |
          git rev-parse HEAD
          set -o pipefail
          npm run test:economy-horizons | tee audit-report.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ matrix.revision.name }}-${{ matrix.mode }}
          path: audit-report.log
          if-no-files-found: warn
